<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AldAumentata</title>


    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <link href="./style.css" rel="stylesheet" />

</head>
<body>

    <a-scene mindar-image="imageTargetSrc: ./targetsDef.mind;" xr-mode-ui="enabled: false" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
     
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
        <a-entity mindar-image-target="targetIndex: 0" id="main"> </a-entity>
        <a-entity mindar-image-target="targetIndex: 1" id="main1"> </a-entity>
        <a-entity mindar-image-target="targetIndex: 2" id="main2"> </a-entity>
        <a-entity mindar-image-target="targetIndex: 3" id="main3"> </a-entity>
    
    </a-scene>

    <div class="audioDiv" id="audioDiv">
        <h1 id="title">La poesia di prova</h1>
        <h2>Ascolta la Poesia</h2>
        <audio id="audio" controls src=""></audio>
        <p id="read"><b>Leggi il testo</b></p>
        <p id="poetry"></p>
        <p id="credits"><b>Credits</b></p>

        <div id="creditsDiv">
            <div>Illustrazioni <br>e implementazione AR</div>
            <b>Ennio Sorrentino</b>
            <div>Voce</div>
            <b>Adriana Busi</b>
            <div>Testi tratti da</div>
            <b>Aforismi e Magie, Rizzoli 1968</b>
        </div>

    </div>

<script>

    const markers = {
        target0: {
                title: "a Roberto Cerati ",
                audio: "./audio/roberto.mp4",
                particleImages: [ 
                    "./imgs/music/PM1.png",
                    "./imgs/music/PM2.png",
                    "./imgs/music/PM3.png",                    
                    "./imgs/music/PM4.png",
                    "./imgs/music/PM5.png",
                    "./imgs/music/PM6.png",                    
                    "./imgs/music/PM7.png",
                    "./imgs/music/PM8.png",
                    "./imgs/music/PM9.png",                    
                    "./imgs/music/PM10.png",
                    "./imgs/music/PM11.png",
                    "./imgs/music/PM12.png",

                ],
                text :`Hai un filo d’erba<br>
                        nei tuoi bianchi capelli,<br>
                        un puro gelsomino d’attesa.<br>
                        Così fiuti in me<br>
                        il cuore sempre verde,<br>
                        la ragazza d’un tempo<br>
                        dall’anima canora.`
                },

        target3: {
            title: "O ragazza infinita",
            audio: "./audio/Ragazza.mp4",
            particleImages: [
                "./imgs/cuori/PC1.png",
                "./imgs/cuori/PC2.png",
                "./imgs/cuori/PC3.png",
                "./imgs/cuori/PC4.png",
                "./imgs/cuori/PC5.png",
                "./imgs/cuori/PC6.png",
                "./imgs/cuori/PC7.png",
                "./imgs/cuori/PC9.png",
                "./imgs/cuori/PC10.png",
                "./imgs/cuori/PC12.png",
                "./imgs/cuori/PC13.png",
                "./imgs/cuori/PC14.png",
                "./imgs/cuori/PC15.png",
                "./imgs/cuori/PC16.png",
                "./imgs/cuori/PC17.png",
                ],
            text :`O ragazza infinita<br>
                    che brancoli nel buio<br>
                    di un’ombra che cammina<br>
                    in te:<br>
                    mortale la tragedia dell’uomo<br>
                    se cerca nei capelli<br>
                    la tensione divina<br>
                    e così quell’amore<br>
                    che credi spensierato<br>
                    è il cervello di un uomo<br>
                    che ama la parola<br>
                    e la parola è il gesto<br>
                    che anima le madri<br>
                    che vedono nei figli<br>
                    un amore inventato.`
             },

        target1: {
            title: "per Tommaso",
            audio: "./audio/tommaso.mp4",
            particleImages: [
                "./imgs/letters/PL1.png",
                "./imgs/letters/PL2.png",
                "./imgs/letters/PL3.png",
                "./imgs/letters/PL4.png",
                "./imgs/letters/PL5.png",
                "./imgs/letters/PL6.png",
                "./imgs/letters/PL7.png",
                "./imgs/letters/PL8.png",
                "./imgs/letters/PL10.png",
                "./imgs/letters/PL11.png",
                "./imgs/letters/PL12.png",
                "./imgs/letters/PL13.png",
                "./imgs/letters/PL14.png",
                "./imgs/letters/PL15.png",
                "./imgs/letters/PL16.png",
                "./imgs/letters/PL17.png",
                "./imgs/letters/PL18.png",
                "./imgs/letters/PL19.png",
                "./imgs/letters/PL20.png",
                "./imgs/letters/PL21.png",
                "./imgs/letters/PL22.png",
             ],
            text :`Raggiungono i figli dei poeti<br>
                    tanti bugiardi palloncini<br>
                    che una mano, a volte inesperta,<br>
                    lascia volare nel cielo.<br>
                    Non sono tutti angeli Tommaso,<br>
                    quelli che volano intorno,<br>
                    e a volte è un amore grande<br>
                    che tradisce il mistero di tuo padre.<br>
                    Sempre misterioso è l’amore paterno,<br>
                    credi, il mio sillabario sei tu.<br>
                    Ho imparato parola per parola<br>
                    a crescerti nella vita, sei il mio maestro.<br>
                    Ma anche io come Pinocchio<br>
                    vendo il mio abbecedario<br>
                    per un bacio d’amore.`
                },

        target2: {
            title: "La minestra mandata da Dio",
            audio: "./audio/minestra.mp4",
            particleImages: [ 
                "./imgs/stars/PS1.png",
                "./imgs/stars/PS2.png",
                "./imgs/stars/PS3.png",
                "./imgs/stars/PS4.png",
                "./imgs/stars/PS5.png",
                "./imgs/stars/PS6.png",
                "./imgs/stars/PS7.png",
                "./imgs/stars/PS8.png",
                "./imgs/stars/PS9.png",
                "./imgs/stars/PS10.png",
                "./imgs/stars/PS11.png",
                "./imgs/stars/PS12.png",
                "./imgs/stars/PS13.png",
                "./imgs/stars/PS14.png",
                "./imgs/stars/PS15.png",
                "./imgs/stars/PS16.png",
                "./imgs/stars/PS17.png",
            ],
            text :`La minestra mandata da Dio<br>
                    adesso si raffredda.<br>
                    È ora di rinnovare l’anima<br>
                    e il cucchiaio.<br>
                    Questo pane degli angeli infinito,<br>
                    o questa comunione di lenticchia,<br>
                    è questo digerir bene, almeno il cielo.<br>
                    Dimmi come si può,<br>
                    che digestivo adoperi tu adesso.`
        }
    };

    let main = document.getElementById("main")
    let main1 = document.getElementById("main1")
    let main2 = document.getElementById("main2")
    let main3 = document.getElementById("main3")

    let audioDiv = document.getElementById("audioDiv")
    let interval = null
    let read = document.getElementById("read")    
    let poetry = document.getElementById("poetry")
    let title = document.getElementById("title")
    let audio =document.getElementById("audio")

    let credits = document.getElementById("credits")
    let creditsDiv =document.getElementById("creditsDiv")
    
    poetry.style.display="none"
    creditsDiv.style.display="none"
    
    var creditsOpen = 0
    var poetryOpen = 0

    function createElement(parent, target_index){


        const target = markers[`target${target_index}`];

        const x = -1 + Math.random()*2
        const y = -1 + Math.random()*2

        const textureIndex = Math.floor(Math.random()*target.particleImages.length) 

        const newEntity = document.createElement('a-entity')

        newEntity.setAttribute("visible", false);

        newEntity.x = x;
        newEntity.y = y;

        newEntity.setAttribute('position', {x: x, y: y});
        newEntity.setAttribute('geometry', {
            primitive: 'plane',
            height: 0.3,
            width: 0.3,
        });

        newEntity.setAttribute("animation", {
        property: "position",
        to: `${x} ${y} 8`,
        dur: 8000,
        easing: "linear",
        loop: true,
        })

        newEntity.setAttribute("material", {
            src: target.particleImages[textureIndex],
            transparent: true,
            shader: "flat",
            side: "double"
        });

        newEntity.addEventListener("materialtextureloaded", () => {
            newEntity.setAttribute("visible", true);
        }, { once: true });

        parent.appendChild(newEntity)


    }

    function render(target_index){
        const target = markers[`target${target_index}`];
        console.log(target)
        audioDiv.style.display = "flex"
        audio.src = target.audio

        poetry.innerHTML = target.text
        title.innerHTML = target.title
        
    }

    function elementLost() {
        audioDiv.style.display = "none"
        audio.pause()
        clearInterval(interval)

        poetryOpen = 0
        poetry.style.display="none"

        creditsOpen= 0
        creditsDiv.style.display="none"
    }
    
    // ENTITY 0
    main.addEventListener("targetFound", event => {  
        render(0)
        interval = setInterval(() =>createElement(main, 0), 250)
    })

    main.addEventListener("targetLost", event => {  
        main.replaceChildren()
        elementLost()
    })

    // ENTITY 1
    main1.addEventListener("targetFound", event => {  
        render(1)
        interval = setInterval(() =>createElement(main1, 1), 250)
    })

    main1.addEventListener("targetLost", event => {  
        main1.replaceChildren()
        elementLost()
    })

    // ENTITY 2
    main2.addEventListener("targetFound", event => {  
        render(2)
        interval = setInterval(() =>createElement(main2, 2), 250)
    })

    main2.addEventListener("targetLost", event => {  
        main2.replaceChildren()
        elementLost()
    })

    // ENTITY 3
    main3.addEventListener("targetFound", event => {  
        render(3)
        interval = setInterval(() =>createElement(main3, 3), 250)
    })

    main3.addEventListener("targetLost", event => {  
        main3.replaceChildren()
        elementLost()
    })


    //Toggles

    read.addEventListener("click", event=>{
        if(poetryOpen==0){
            poetryOpen = 1
            poetry.style.display="block"

            creditsOpen= 0
            creditsDiv.style.display="none"

        } else{
            poetryOpen = 0
            poetry.style.display="none"
        }
    })


    credits.addEventListener("click", event=>{
        if(creditsOpen==0){
            creditsOpen = 1
            creditsDiv.style.display="block"


            poetryOpen = 0
            poetry.style.display="none"
            
        } else{
            creditsOpen= 0
            creditsDiv.style.display="none"
        }
    })

</script>
   
</body>
</html>
