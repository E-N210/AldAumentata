<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AldAumentata</title>

    <link href="./style.css" rel="stylesheet" />

</head>
<body>
        <div class="page" id="page1">

            <h1 id="title"></h1>
            <p id="text"></p>
        
        <div id="next">Continua...</div>
        </div>

        <p id="skip">Salta l'Introduzione</p>



</body>
<script>

    const pages = {
        pageOne:{
            title : "Benvenuto!", 
            text :  `AldAumentata è un'esperienza AR ispirata alle poesie di Alda Merini`,
            next : "pageTwo",
            cta:"Continua..."
        },
        
        pageTwo:{
            title : "Inquadra <br>le opere", 
            text :  `ti troverai davanti 4 quadretti, inquadrali per vederli prendere vita`,
            next : "pageThree",
            cta:"Continua..."
        },

        pageThree:{
            title : "Ascolta <br>le Poesie", 
            text :  `Ascolta la poesia a cui ogni opera è ispirata ... Indossa le cuffie per non disturbare gli altri visitatori`,
            cta:`<b>Inizia!</b>`
        },
        
    }

    

var speed = 80;

let currentPage = pages["pageOne"];
var page = 0

let textDiv = document.getElementById("text");
let titleDiv = document.getElementById("title");
let next = document.getElementById("next")
let skip = document.getElementById("skip")

next.style.display="none"

function typeWriter(text, element) {
    let i = 0; // Independent counter for each call

    function type() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(type, speed);
        } else{
            next.style.display="flex"
        }
    }

    type();
}

next.addEventListener("click", event=>{

    if(page<2){
        page = page+1


        next.style.display="none"
        textDiv.innerHTML=""
        currentPage =pages[currentPage.next]

        next.innerHTML=currentPage.cta

        typeWriter(currentPage.text, textDiv);
        titleDiv.innerHTML=currentPage.title


        titleDiv.style.animation = "none";
        titleDiv.offsetHeight; // Force browser reflow
        titleDiv.style.animation = "fadeIn 1s ease";


    } else{
        window.open("./main.html", "_self")
    }

})



    typeWriter(currentPage.text, textDiv);
    titleDiv.innerHTML=currentPage.title

skip.addEventListener("click", event=>{
            window.open("./main.html", "_self")
    })

</script>
</html>
